<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        .full-screen-bg {
            background-image: url('https://www.thesslstore.com/blog/wp-content/uploads/2021/05/client-authentication-certificate-feature.jpg');
        }
    </style>
</head>
<body class="full-screen-bg bg-cover bg-center bg-no-repeat min-h-screen w-full flex items-center justify-center p-0 font-sans">

    <div class="w-full min-h-screen bg-gradient-to-b from-neutral-950/10 via-transparent to-neutral-950/30 flex items-center justify-center p-4">

        <div class="bg-neutral-900/85 backdrop-blur-xl border border-neutral-800/80 p-10 md:p-12 rounded-[2.5rem] shadow-[0_25px_70px_-10px_rgba(0,0,0,0.95)] w-full max-w-md animate__animated animate__fadeIn relative z-10">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-black uppercase tracking-wide text-white">Register User</h2>
                <p class="text-neutral-400 font-mono text-xs mt-1.5">Enter Username and Password to create </p>
            </div>

            <form method="POST" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label class="block text-[11px] font-mono font-bold uppercase tracking-widest text-neutral-400 mb-2">New Username:</label>
                    <input type="text" name="username" placeholder="ENTER NEW USERNAME" required
                           class="w-full px-5 py-4 bg-neutral-950 border border-neutral-900 text-emerald-400 font-mono placeholder-neutral-700 focus:outline-none focus:border-emerald-500 rounded-xl transition-all text-sm shadow-inner">
                </div>

                <div>
                    <label class="block text-[11px] font-mono font-bold uppercase tracking-widest text-neutral-400 mb-2">Enter Password:</label>
                    <input type="password" name="password" placeholder="SECRET ACCESS PASSWORD" required
                           class="w-full px-5 py-4 bg-neutral-950 border border-neutral-900 text-emerald-400 font-mono placeholder-neutral-700 focus:outline-none focus:border-emerald-500 rounded-xl transition-all text-sm shadow-inner">
                </div>

                <div>
                    <label class="block text-[11px] font-mono font-bold uppercase tracking-widest text-neutral-400 mb-2">Confirm Password:</label>
                    <input type="password" name="password2" placeholder="VERIFY ACCESS PASSWORD" required
                           class="w-full px-5 py-4 bg-neutral-950 border border-neutral-900 text-emerald-400 font-mono placeholder-neutral-700 focus:outline-none focus:border-emerald-500 rounded-xl transition-all text-sm shadow-inner">
                </div>

                <button type="submit" class="w-full mt-2 py-4 bg-gradient-to-r from-neutral-800 to-neutral-950 hover:from-neutral-700 hover:to-neutral-900 text-emerald-400 font-mono font-black border border-neutral-950 rounded-xl text-xs tracking-widest uppercase transition-all shadow-lg">
                    Register Now 🛠️
                </button>
            </form>

            <div class="mt-10 pt-6 border-t border-neutral-900 text-center">
                <a href="{% url 'login_page' %}" class="text-xs font-mono font-bold tracking-widest text-neutral-500 hover:text-emerald-400 transition-colors uppercase">
                    [ Click Here for Login Page ]
                </a>
            </div>
        </div>

    </div>

</body>
</html>
